project:
  name: Browser_Test_Project
  date: 2025-10-07

data_sources:
  numpy_stack:
    file: tests/test_data/valid_4d_array.npy
    epsg: 32610
    origin: [500000, 4200000]
    pixel_size: 10
    before_index: 0
    after_index: 1

  shapefile:
    file: data/landslides.geojson
    id_field: FID

  predictions:
    file: tests/test_data/valid_3d_predictions.npy
    default_index: 1

display:
  context_buffer: 1.5
  min_window: 8
  max_window: 32

labels:
  - code: 0
    name: Not Evaluated
    color: "#808080"
  - code: 1
    name: Correct
    color: "#00FF00"
  - code: 2
    name: Incorrect
    color: "#FF0000"
  - code: 3
    name: Uncertain
    color: "#FFFF00"
