project:
  name: Browser_Test_Project
  date: 2025-10-07

data_sources:
  numpy_stack:
    file: data/lombok/images.npy
    epsg: 3857
    origin: [12916671.108, -922363.2210]
    pixel_size: [4.7683, 4.82005]
    before_index: 0
    after_index: 1

  shapefile:
    file: data/lombok/lombok_1.gpkg
    id_field: fid
    layer: reprojected

  predictions:
    file: data/lombok/output_7.tif
    default_index: 1
    origin: [12916673.0062, -922365.6203]
    pixel_size: [4.777, 4.777]

  labels:
    file: data/lombok/labels.npy
    default_index: 0
    origin: [12916671.108, -922363.2210]
    pixel_size: [4.7683, 4.82005]

display:
  context_buffer: 1.5
  min_window: 8
  max_window: 32

labels:
  - code: large-overmapping
    name: Large Overmapping
    color: "#FF0000"
    key: "1"
  - code: overmapping
    name: Overmapping
    color: "#FF8800"
    key: "2"
  - code: accurate
    name: Accurate
    color: "#00FF00"
    key: "3"
  - code: undermapping
    name: Undermapping
    color: "#0088FF"
    key: "4"
  - code: large-undermapping
    name: Large Undermapping
    color: "#0000FF"
    key: "5"

grid_sampling:
  tile_size: 64  # Size of each grid tile in pixels
  random_seed: 42  # Seed for reproducible pseudo-random sampling
  require_polygons: true  # Only show tiles that contain polygons

labels_output:
  file: data/lombok/tile_labels_64.csv  # CSV file to store tile labels

class_counts:
  large-overmapping: 0
  overmapping: 0
  accurate: 0
  undermapping: 0
  large-undermapping: 0